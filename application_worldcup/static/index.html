/**
 * Tipo B Knockout: shows all KO matches grouped by date/jornada.
 * Each jornada shows:
 *   - Lock status (locked if <4h before first match)
 *   - Matchup cards (home vs away) with bracket bonus badge
 *   - Score inputs for the result (for result points scoring)
 * As results come in, next jornada unlocks.
 */
function renderTypeBKnockout(pred, results, readonly){
  const allKoMatches=[
    ...KNOCKOUT_MATCHES.roundOf32,
    ...KNOCKOUT_MATCHES.quarterFinals,
    ...KNOCKOUT_MATCHES.semiFinals,
    ...(KNOCKOUT_MATCHES.semiFinals2||[]),
    KNOCKOUT_MATCHES.thirdPlace,
    KNOCKOUT_MATCHES.final,
  ];

  const phaseOf={};
  KNOCKOUT_MATCHES.roundOf32.forEach(m=>{phaseOf[m.id]='roundOf32';});
  KNOCKOUT_MATCHES.quarterFinals.forEach(m=>{phaseOf[m.id]='quarterFinals';});
  KNOCKOUT_MATCHES.semiFinals.forEach(m=>{phaseOf[m.id]='semiFinals';});
  (KNOCKOUT_MATCHES.semiFinals2||[]).forEach(m=>{phaseOf[m.id]='semiFinals2';});
  phaseOf[KNOCKOUT_MATCHES.thirdPlace.id]='thirdPlace';
  phaseOf[KNOCKOUT_MATCHES.final.id]='final';

  // Group by date
  const byDate={};
  allKoMatches.forEach(m=>{ if(!byDate[m.date]) byDate[m.date]=[]; byDate[m.date].push(m); });

  const phaseLabels={
    roundOf32:`🔵 ${t('roundOf32')}`, quarterFinals:`🟢 ${t('quarterFinals')}`,
    semiFinals:'🟡 Cuartos', semiFinals2:'🟠 Semifinales',
    thirdPlace:'🥉 3er y 4to Lugar', final:'🏆 Final',
  };

  // Build winner map from saved predictions for bracket resolution
  const winnerByMn={};
  KNOCKOUT_MATCHES.roundOf32.forEach(m=>{
    const p=pred.knockoutMatches?.[m.id];
    if(!p||p.home===''||p.home===undefined) return;
    const h=parseInt(p.home),a=parseInt(p.away);
    let w='';
    if(h>a) w=p.homeTeam||'';
    else if(a>h) w=p.awayTeam||'';
    else w=p.penaltyWinner||'';
    if(w) winnerByMn[m.mn]=w;
  });
  // Also cascade saved predictions from subsequent phases
  [...KNOCKOUT_MATCHES.quarterFinals,...KNOCKOUT_MATCHES.semiFinals,...(KNOCKOUT_MATCHES.semiFinals2||[])].forEach(m=>{
    const p=pred.knockoutMatches?.[m.id];
    if(!p||p.home===''||p.home===undefined) return;
    const h=parseInt(p.home),a=parseInt(p.away);
    let w='';
    if(h>a) w=p.homeTeam||'';
    else if(a>h) w=p.awayTeam||'';
    else w=p.penaltyWinner||'';
    if(w) winnerByMn[m.mn]=w;
  });

  function resolveSlot(slot, matchId){
  if(!slot) return slot;

  // --- Resolver Wxx usando resultados reales ---
  const mW = slot.match(/^W(\d+)$/);
  if(mW){
    const mn = parseInt(mW[1]);
    const prev = allKoMatches.find(m => m.mn === mn);
    const pr = results_ko.knockoutMatches?.[prev?.id];

    if(pr){
      if(pr.home > pr.away) return pr.homeTeam;
      if(pr.away > pr.home) return pr.awayTeam;
      if(pr.penaltyWinner) return pr.penaltyWinner;
    }

    // fallback: predicciones
    return winnerByMn[mn] || slot;
  }

  // --- Resolver Lxx usando resultados reales ---
  const mL = slot.match(/^L(\d+)$/);
  if(mL){
    const mn = parseInt(mL[1]);
    const prev = allKoMatches.find(m => m.mn === mn);
    const pr = results_ko.knockoutMatches?.[prev?.id];

    if(pr){
      if(pr.home > pr.away) return pr.awayTeam;
      if(pr.away > pr.home) return pr.homeTeam;
      if(pr.penaltyWinner){
        return pr.penaltyWinner === pr.homeTeam ? pr.awayTeam : pr.homeTeam;
      }
    }

    // fallback: predicciones
    const pp = pred.knockoutMatches?.[prev?.id];
    if(pp){
      const h = parseInt(pp.home), a = parseInt(pp.away);
      let w = '';
      if(h > a) w = pp.homeTeam;
      else if(a > h) w = pp.awayTeam;
      else w = pp.penaltyWinner || '';

      if(w){
        return w === pp.homeTeam ? pp.awayTeam : pp.homeTeam;
      }
    }

    return slot;
  }

  // --- Slot directo del partido actual ---
  const adminResult = results_ko.knockoutMatches?.[matchId];
  if(adminResult){
    const koMatch = allKoMatches.find(m => m.id === matchId);
    if(koMatch){
      if(koMatch.hs === slot) return adminResult.homeTeam;
      if(koMatch.as === slot) return adminResult.awayTeam;
    }
  }

  return slot;
}

            ${penSel}

            ${r?`<span style="font-size:0.68rem;color:var(--gray-400)">✅ ${r.home}—${r.away}</span>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });

  return html||`<div class="empty-state-card"><p>No hay partidos de eliminatoria disponibles aún.</p></div>`;
}

// Client-side jornada lock check (mirrors server logic)
function isJornadaLockedClient(dateStr){
  try{
    const d=new Date(dateStr+'T22:00:00Z'); // assume 18:00 local → ~22:00 UTC
    return Date.now() >= d.getTime() - 4*60*60*1000;
  }catch(e){return false;}
}

function renderKnockoutPredictions(predData, readonly=false, isGroupsSubmitted=false, gameType='A'){
  const pred=predData||{groupMatches:{},knockoutMatches:{}};
  const results=getResults();
  const ko=KNOCKOUT_MATCHES;
  let html='';

  // Tipo A KO tab unlock conditions:
  //  1. User must have submitted group predictions
  //  2. Admin must have finished entering all group results
  const results_ko = getResults();
  const adminFinishedGroups = GROUP_MATCHES.every(m=>results_ko.groupMatches?.[m.id]!==undefined);

  if(gameType==='A' && !readonly){
    if(!isGroupsSubmitted){
      return `<div class="empty-state-card"><div class="empty-icon">🔒</div>

      </div>`;

    if(!adminFinishedGroups){
      const done=GROUP_MATCHES.filter(m=>results_ko.groupMatches?.[m.id]).length;
      html+=`<div style="background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.25);border-radius:8px;padding:0.6rem 1rem;margin-bottom:1rem;font-size:0.82rem;color:#60a5fa">
        ⏳ <strong>Fase de grupos en curso</strong> — ${done}/${GROUP_MATCHES.length} partidos con resultado oficial.
        Los equipos de cruces se completan conforme el Admin registre los resultados de grupos.
      </div>`;
      try{ html+=renderBestThirdsPanel(getBestThirdPlaces(results_ko,pred,false)); }catch(e){}
    }
  }

  // Tipo A KO: use REAL bracket from admin results for all team resolution
  const realGS_ko=buildRealGroupStandings();
  const thirdsReal_ko=getBestThirdPlaces(results_ko,null,false);
  const realThirdsSlots_ko=assignThirdsToSlots(thirdsReal_ko.all);

  // Build real winner map from admin results (for cascading team resolution)
  const realWinnerByMn={};
  const allRealMatches=[...ko.roundOf32,...ko.quarterFinals,...ko.semiFinals,...(ko.semiFinals2||[])];
  allRealMatches.forEach(m=>{
    const rr=results_ko.knockoutMatches?.[m.id];
    if(rr&&rr.home!==undefined){
      const w=rr.home>rr.away?rr.homeTeam:rr.away>rr.home?rr.awayTeam:rr.penaltyWinner||'';
      if(w) realWinnerByMn[m.mn]=w;
    }
  });

  // Resolve a slot to a real team using admin data
  function resolveRealSlot(slot, matchId){
    if(!slot) return '';
    const mW=slot.match(/^W(\d+)$/); if(mW) return realWinnerByMn[parseInt(mW[1])]||'';
    const mL=slot.match(/^L(\d+)$/); if(mL){
      const prev=allRealMatches.find(m=>m.mn===parseInt(mL[1]));
      if(!prev) return '';
      const pr=results_ko.knockoutMatches?.[prev.id];
      if(!pr||pr.home===undefined) return '';
      // L-slot = loser: si empate, el perdedor es quien NO ganó los penales
      if(pr.home>pr.away) return pr.awayTeam||'';
      if(pr.away>pr.home) return pr.homeTeam||'';
      const pw=pr.penaltyWinner||'';
      return pw===pr.homeTeam?pr.awayTeam||'':pr.homeTeam||'';
    }
    // Try to resolve from group standings
    const fromStandings=resolveRealSlotTeam(slot,matchId,realGS_ko,realThirdsSlots_ko);
    if(fromStandings) return fromStandings;
    // Fallback: use homeTeam/awayTeam that the Admin already saved for this match
    const adminResult=results_ko.knockoutMatches?.[matchId];
    if(adminResult){
      const _allKoFlat=[...KNOCKOUT_MATCHES.roundOf32,...KNOCKOUT_MATCHES.quarterFinals,
        ...KNOCKOUT_MATCHES.semiFinals,...(KNOCKOUT_MATCHES.semiFinals2||[]),
        KNOCKOUT_MATCHES.thirdPlace,KNOCKOUT_MATCHES.final];
      const koMatch=_allKoFlat.find(m=>m.id===matchId);
      if(koMatch){
        if(koMatch.hs===slot) return adminResult.homeTeam||'';
        if(koMatch.as===slot) return adminResult.awayTeam||'';
      }
    }
    return '';
  }

  // Check if user has submitted all KO predictions
  const koAllFilled=allRealMatches.every(m=>{
    const rr=results_ko.knockoutMatches?.[m.id]; // skip if admin hasn't set it
    if(!rr) return true; // can't predict unscheduled match yet
    const p=pred.knockoutMatches?.[m.id];
    return p&&p.home!==undefined&&p.home!==''&&p.away!==undefined&&p.away!=='';
  });
  const koSubmitted=pred.knockoutsSubmitted||false;

  // BLOQUEO AUTOMÁTICO: si el admin ya guardó al menos un resultado de eliminatoria,
  // los pronósticos se bloquean para edición (aunque no se hayan enviado todavía).
  // Esto evita que los participantes modifiquen sus picks después de que empiece la KO.
  const adminHasAnyKoResult = Object.keys(results_ko.knockoutMatches||{}).length > 0;
  // En modo pruebas el admin puede forzar el desbloqueo aunque ya haya resultados cargados
  const testUnlocked = !!(currentGame()?._testUnlockKo);
  const koEffectivelyLocked = koSubmitted || (adminHasAnyKoResult && !testUnlocked);

  // R32 matchups already shown at the end of the Group Stage tab — skipped here.
  // In KO tab for Tipo A we jump straight to R32 match predictions using REAL teams.

  // ── Tipo B Knockout: matchups by jornada (read-only brackets) ────────
  if(gameType==='B'){
    html+=renderTypeBKnockout(pred, getResults(), readonly);
    if(!readonly){
    html+=`<div class="save-bar" style="gap:0.75rem;flex-wrap:wrap">
      <button class="btn btn-outline btn-lg" style="border-color:rgba(139,92,246,0.4);color:#a78bfa;cursor:not-allowed;opacity:0.7"
        title="Próximamente — Versión Premium" onclick="showPremiumToast()">
        ${t('predAiSuggest')} <span style="font-size:0.65rem;background:rgba(139,92,246,0.3);padding:1px 5px;border-radius:4px;margin-left:4px">PREMIUM</span>
      </button>
      <button class="btn btn-outline btn-lg" style="border-color:rgba(139,92,246,0.4);color:#a78bfa;cursor:not-allowed;opacity:0.7"
        title="Próximamente — Versión Premium" onclick="showPremiumToast()">
        👑 📊 Marcador estratégico <span style="font-size:0.65rem;background:rgba(139,92,246,0.3);padding:1px 5px;border-radius:4px;margin-left:4px">PREMIUM</span>
      </button>
      <button class="btn btn-primary btn-lg" onclick="saveKnockoutPredictions()">${t('savePredictions')}</button>
    </div>`;
  }
  return html;
}

  // ── Type A Knockout: use REAL bracket from admin results ─────────────
  // Build a map: matchNumber → winner team id (from user predictions + penalty picks)
  // winner[mn] = teamId of predicted winner
  const winnerByMn = {};  // mn → teamId

  // Resolve R32 winners from the user's R32 score predictions
  ko.roundOf32.forEach(match=>{
    const p=pred.knockoutMatches?.[match.id];
    if(!p||p.home===undefined||p.home===''||p.away===undefined||p.away==='') return;
    const h=parseInt(p.home), a=parseInt(p.away);
    let winner='';
    if(h>a) winner=p.homeTeam||'';
    else if(a>h) winner=p.awayTeam||'';
    else{ // draw → penalties winner
      winner=p.penaltyWinner||'';
    }
    if(winner) winnerByMn[match.mn]=winner;
  });

  // Then cascade through QF, SF, SF2, final using winnerByMn
  // FIFA 2026 bracket: each match references two previous match numbers
  const allKoPhases=[
    {key:'roundOf32',     label:'🔵 16avos de Final',     matches:ko.roundOf32},
    {key:'quarterFinals', label:'🟢 Octavos de Final',     matches:ko.quarterFinals},
    {key:'semiFinals',    label:'🟡 Cuartos de Final',     matches:ko.semiFinals},
    {key:'semiFinals2',   label:'🟠 Semifinales',          matches:ko.semiFinals2||[]},
    {key:'thirdPlace',    label:`🥉 ${t('thirdPlace')}`,   matches:[ko.thirdPlace]},
    {key:'final',         label:`🏆 ${t('final')}`,        matches:[ko.final]},
  ];

  // Progress counter for KO predictions
  const allKoM=[...ko.roundOf32,...ko.quarterFinals,...ko.semiFinals,...(ko.semiFinals2||[]),ko.thirdPlace,ko.final];
  const koFilled=allKoM.filter(m=>{
    const p=pred.knockoutMatches?.[m.id];
    return p&&p.home!==undefined&&p.home!==''&&p.away!==undefined&&p.away!=='';
  }).length;
  const koTotal=allKoM.length;

  // Sticky top bar for KO predictions
  if(!readonly&&!koEffectivelyLocked){
    html+=`<div style="position:sticky;top:0;z-index:10;background:var(--dark);border-bottom:1px solid rgba(255,255,255,0.07);padding:0.5rem 0.25rem;margin-bottom:0.75rem;display:flex;gap:0.4rem;flex-wrap:wrap;align-items:center">
      <span style="font-size:0.72rem;color:var(--gray-400);flex-shrink:0">${koFilled}/${allKoM.length} ⚽</span>
      <button class="btn btn-sm btn-outline" onclick="saveKnockoutPredictions(false)">💾 ${t('savePredictions')}</button>
      <button class="btn btn-sm btn-gold" onclick="saveKnockoutPredictions(true)">🔒 Enviar eliminatoria</button>
      <button class="btn btn-sm" style="border-color:rgba(139,92,246,0.4);color:#a78bfa;opacity:0.65;cursor:not-allowed" onclick="showPremiumToast()">👑 🤖 IA <span style="font-size:0.58rem;background:rgba(139,92,246,0.3);padding:0 3px;border-radius:3px">PREMIUM</span></button>
      <button class="btn btn-sm" style="border-color:rgba(139,92,246,0.4);color:#a78bfa;opacity:0.65;cursor:not-allowed" onclick="showPremiumToast()">👑 📊 Estratégico <span style="font-size:0.58rem;background:rgba(139,92,246,0.3);padding:0 3px;border-radius:3px">PREMIUM</span></button>
    </div>`;
  } else if(koEffectivelyLocked){
    html+=`<div style="background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:8px;padding:0.5rem 0.75rem;margin-bottom:0.75rem;font-size:0.82rem;color:var(--green-light)">
      🔒 ${koSubmitted ? 'Pronósticos de eliminatoria enviados' : 'Eliminatoria en curso — pronósticos bloqueados'} — ${koFilled}/${allKoM.length} partidos pronosticados
    </div>`;
  }

  // ── BRACKET VISUAL ─────────────────────────────────────────────────
  // Correct bracket tree order (by dependency, not by mn number):
  // Left side:  R32 slots → QF → SF → SF2 → FINAL
  //   L1:mn73, L2:mn75, L3:mn74, L4:mn77, L5:mn76, L6:mn78, L7:mn79, L8:mn80
  //   QFL: QF2(W73,W75), QF1(W74,W77), QF3(W76,W78), QF4(W79,W80)
  //   SFL: SF1(W89,W90), SF3(W91,W92)  → SF5(W97,W98)
  // Right side: R32 slots → QF → SF → SF2 → FINAL
  //   R1:mn83, R2:mn84, R3:mn81, R4:mn82, R5:mn86, R6:mn88, R7:mn85, R8:mn87
  //   QFR: QF5(W83,W84), QF6(W81,W82), QF7(W86,W88), QF8(W85,W87)
  //   SFR: SF2(W93,W94), SF4(W95,W96)  → SF6(W99,W100)

  function byMn(mn){ return [...ko.roundOf32,...ko.quarterFinals,...ko.semiFinals,...(ko.semiFinals2||[])].find(m=>m.mn===mn)||
    (ko.thirdPlace.mn===mn?ko.thirdPlace:null)||(ko.final.mn===mn?ko.final:null); }

  // Pre-build bracket slot order
  // IZQUIERDA: P73,P75,P74,P77,P83,P84,P81,P82
  //   QF: P90(W73+W75), P89(W74+W77), P93(W83+W84), P94(W81+W82)
  //   SF: P97(W89+W90), P98(W93+W94)  →  SF2: P101
  const bkL = [73,75,74,77,83,84,81,82].map(n=>byMn(n));
  // DERECHA: P76,P78,P79,P80,P86,P88,P85,P87
  //   QF: P91(W76+W78), P92(W79+W80), P95(W86+W88), P96(W85+W87)
  //   SF: P99(W91+W92), P100(W95+W96)  →  SF2: P102
  const bkR = [76,78,79,80,86,88,85,87].map(n=>byMn(n));
  const bkQFL = [90,89,93,94].map(n=>byMn(n));   // QF2(W73+W75), QF1(W74+W77), QF5(W83+W84), QF6(W81+W82)
  const bkQFR = [91,92,95,96].map(n=>byMn(n));   // QF3(W76+W78), QF4(W79+W80), QF7(W86+W88), QF8(W85+W87)
  const bkSFL = [97,98].map(n=>byMn(n));          // SF1(W89+W90), SF2(W93+W94)
  const bkSFR = [99,100].map(n=>byMn(n));         // SF3(W91+W92), SF4(W95+W96)
  const bkSF2L = byMn(101);
  const bkSF2R = byMn(102);

  // Helper: render one bracket match card
  function bracketCard(match, phaseKey, extraClass=''){
    if(!match) return '<div class="bk-card bk-empty"></div>';

    const baseHome = resolveRealSlot(match.hs, match.id);
    const baseAway = resolveRealSlot(match.as, match.id);

    function slotLabel(slot){
      if(!slot) return '?';
      if(/^W(\d+)$/.test(slot)) return slot;
      if(/^L(\d+)$/.test(slot)) return slot;
      return '?';
    }

    function predWinSlot(slot){
      if(!slot) return '';

      const mW = slot.match(/^W(\d+)$/);
      if(mW){
        return winnerByMn[parseInt(mW[1])] 
            || realWinnerByMn[parseInt(mW[1])] 
            || slot; // ← nunca devolver ''
      }

      const mL = slot.match(/^L(\d+)$/);
      if(mL){
        const prevMn = parseInt(mL[1]);
        const prevM = allRealMatches.find(m => m.mn === prevMn);
        if(!prevM) return slot; // ← no existe el partido previo

        // 1) Predicted loser
        const predWinner = winnerByMn[prevMn] || '';
        const pp = pred.knockoutMatches?.[prevM.id];

        if(predWinner && pp && pp.home !== undefined && pp.home !== ''){
          const hSlotW = prevM.hs?.match(/^W(\d+)$/);
          const aSlotW = prevM.as?.match(/^W(\d+)$/);

          const hT = hSlotW 
              ? winnerByMn[parseInt(hSlotW[1])] || resolveRealSlot(prevM.hs, prevM.id)
              : resolveRealSlot(prevM.hs, prevM.id);

          const aT = aSlotW 
              ? winnerByMn[parseInt(aSlotW[1])] || resolveRealSlot(prevM.as, prevM.id)
              : resolveRealSlot(prevM.as, prevM.id);

          const loser = predWinner === hT ? aT : hT;
          if(loser) return loser;
        }

        // 2) Prediction cache
        if(pp && pp.homeTeam && pp.awayTeam){
          const h = parseInt(pp.home), a = parseInt(pp.away);
          let w = '';

          if(h > a) w = pp.homeTeam;
          else if(a > h) w = pp.awayTeam;
          else w = pp.penaltyWinner || slot; // ← si no hay penaltyWinner, no inventar

          const loser = w === pp.homeTeam ? pp.awayTeam : pp.homeTeam;
          if(loser) return loser;
        }

        // 3) Real result
        const pr = results_ko.knockoutMatches?.[prevM.id];
        if(pr && pr.home !== undefined){

          // ganador por goles
          if(pr.home > pr.away) return pr.awayTeam;
          if(pr.away > pr.home) return pr.homeTeam;

          // empate → penales
          if(!pr.penaltyWinner) return slot; // ← NO devolver '', evita duplicados

          return pr.penaltyWinner === pr.homeTeam 
              ? pr.awayTeam 
              : pr.homeTeam;
        }

        return slot; // ← fallback seguro
      }

      return resolveRealSlot(slot, match.id);
    }

    // … el resto de tu función sigue igual …

    const homeId = phaseKey==='roundOf32' ? baseHome : predWinSlot(match.hs)||baseHome;
    const awayId = phaseKey==='roundOf32' ? baseAway : predWinSlot(match.as)||baseAway;
    const p = pred.knockoutMatches?.[match.id]||{};
    const locked = koEffectivelyLocked||readonly;
    const homeTeam = homeId||p.homeTeam||'';
    const awayTeam = awayId||p.awayTeam||'';

    // Cascade winner — use user prediction score
    if(p&&p.home!==undefined&&p.home!==''){
      const h=parseInt(p.home), a=parseInt(p.away);
      // Use homeTeam/awayTeam already resolved above — resolveRealSlot fails for W-slots
      const hId2=homeTeam||'';
      const aId2=awayTeam||'';
      let w='';
      if(h>a) w=hId2; else if(a>h) w=aId2; else w=p.penaltyWinner||'';
      if(w) winnerByMn[match.mn]=w;
    }

    const hTeam=getTeam(homeTeam); const aTeam=getTeam(awayTeam);
    const hName=homeTeam||slotLabel(match.hs);
    const aName=awayTeam||slotLabel(match.as);
    const hKnown=!!homeTeam;
    const aKnown=!!awayTeam;
    const hFlag=hKnown?flagImg(homeTeam,'flag-img'):'';
    const aFlag=aKnown?flagImg(awayTeam,'flag-img'):'';

    // Status
    const r=results_ko.knockoutMatches?.[match.id];
    const pts=r?getMatchPoints(match.id,phaseKey,currentParticipant,homeTeam||'',awayTeam||''):null;
    let statusClass='', ptsBadge='';
    if(r&&r.home!==undefined){
      const st=calcKoMatchStatus(p.home,p.away,r.home,r.away,
        p.homeTeam||homeTeam||r.homeTeam||'',p.awayTeam||awayTeam||r.awayTeam||'',r.homeTeam||'',r.awayTeam||'');
      if(st==='exact'){statusClass='exact';ptsBadge=`<span class="pts-badge exact">+${pts}</span>`;}
      else if(st==='resultAndGoals'){statusClass='result-goals';ptsBadge=`<span class="pts-badge result-goals">+${pts}</span>`;}
      else if(st==='resultOnly'){statusClass='result-only';ptsBadge=`<span class="pts-badge result-only">+${pts}</span>`;}
      else{statusClass='wrong';ptsBadge=`<span class="pts-badge wrong">0</span>`;}
    }
    // Bracket bonus badge — only show when the participant CORRECTLY predicted the matchup.
    // roundOf32 cards: bonus shown in the group-stage tab already — skip here to avoid duplication.
    // quarterFinals+ : show ⚔️+N only when participant correctly predicted the REAL matchup.
    // Must compare prediction against REAL teams (from realWinnerByMn/baseHome/baseAway),
    // not against the predicted teams (homeTeam/awayTeam which come from user's own winnerByMn).
    let bracketBadge='';
    if(phaseKey!=='roundOf32'){
      const feederPhase={quarterFinals:'roundOf32',cuartos:'quarterFinals',semiFinals:'cuartos',thirdPlace:'cuartos',final:'cuartos'}[phaseKey]||'';
      // 3er puesto y Final tienen bonuses especiales definidos en semiFinals rules
      let feederBonus=0;
      if(phaseKey==='thirdPlace'){
        feederBonus=(getGameScoringRules().semiFinals||{}).thirdPlaceBonus??7;
      } else if(phaseKey==='final'){
        feederBonus=(getGameScoringRules().semiFinals||{}).finalBonus??15;
      } else {
        feederBonus=feederPhase?(getGameScoringRules()[feederPhase]||{}).correctBracketBonus||0:0;
      }
      // Real teams: prefer stored result homeTeam/awayTeam, then realWinnerByMn slot resolution
      const rr=results_ko.knockoutMatches?.[match.id];
      const realH=rr?.homeTeam||baseHome||'';
      const realA=rr?.awayTeam||baseAway||'';
      if(feederBonus>0&&realH&&realA&&homeTeam&&awayTeam){
        const matched=(realH===homeTeam&&realA===awayTeam)||(realH===awayTeam&&realA===homeTeam);
        if(matched){
          bracketBadge=`<span class="pts-badge exact" style="font-size:0.6rem">⚔️+${feederBonus}</span>`;
        }
      }
    }

    // Penalty selector
    const hVal=p.home!==undefined&&p.home!==''?parseInt(p.home):null;
    const aVal=p.away!==undefined&&p.away!==''?parseInt(p.away):null;
    const isDraw=hVal!==null&&aVal!==null&&hVal===aVal;
    const penSel=isDraw&&homeTeam&&awayTeam&&!locked?`
      <div class="bk-pen-row">
        <span style="font-size:0.68rem;color:var(--gold)">⚽ Penales:</span>
        <label class="bk-pen-opt"><input type="radio" name="pen_${match.id}" value="${homeTeam}" ${p.penaltyWinner===homeTeam?'checked':''} onchange="setPenaltyWinner('${match.id}','${homeTeam}')">${hFlag}<span style="font-size:0.72rem">${hName}</span></label>
        <label class="bk-pen-opt"><input type="radio" name="pen_${match.id}" value="${awayTeam}" ${p.penaltyWinner===awayTeam?'checked':''} onchange="setPenaltyWinner('${match.id}','${awayTeam}')">${aFlag}<span style="font-size:0.72rem">${aName}</span></label>
      </div>`:
      (isDraw&&(!homeTeam||!awayTeam)?`<div style="font-size:0.62rem;color:rgba(245,158,11,0.6);padding:2px 4px">⚠️ Empate — define rondas anteriores</div>`:'');

    const dateLabel=fmtDate(match.date);
    const mnLabel=match.mn?`#${match.mn}`:'';
    // Show penalty winner in official result line
    const penWinnerName = r?.penaltyWinner ? (getTeam(r.penaltyWinner)?.name[currentLang]||r.penaltyWinner) : '';
    const officialRes=r&&r.home!==undefined
      ? `<div class="bk-official">✅ ${r.home}—${r.away}${penWinnerName?` · ⚽ ${penWinnerName}`:''}</div>`
      : '';
    // Show predicted penalty winner when locked
    const predPenName = (locked && isDraw && p.penaltyWinner)
      ? `<div style="font-size:0.62rem;color:var(--gold);padding:2px 4px 0">⚽ ${t('penaltyWinnerLabel').replace('¿','').replace('?','').replace('Qui avance aux tirs au but','Penales').replace('Who advances on penalties','Penalties')}: ${getTeam(p.penaltyWinner)?.name[currentLang]||p.penaltyWinner}</div>`
      : '';

    return `<div class="bk-card ${statusClass} ${extraClass}" data-mid="${match.id}">
      <div class="bk-date"><span class="bk-mn">${mnLabel}</span><span class="bk-dt">${dateLabel}</span></div>
      <div class="bk-match-inner">
        <div class="bk-team-row">
          <div class="team-display">${hFlag}<span class="tname bk-tname" style="${!hKnown?'color:var(--gray-400);font-size:0.63rem':''}">${hName}</span></div>
          ${locked
            ? `<span class="bk-score-locked">${p.home!==undefined&&p.home!==''?p.home:'—'}</span>`
            : `<input type="number" min="0" max="20" class="score-input bk-score-in" id="pred_${match.id}_home" value="${p.home!==undefined&&p.home!==''?p.home:''}" placeholder="0" oninput="onKoScoreInput('${match.id}')">`
          }
        </div>
        <div class="bk-vs-line"></div>
        <div class="bk-team-row">
          <div class="team-display">${aFlag}<span class="tname bk-tname" style="${!aKnown?'color:var(--gray-400);font-size:0.63rem':''}">${aName}</span></div>
          ${locked

            : `<input type="number" min="0" max="20" class="score-input bk-score-in" id="pred_${match.id}_away" value="${p.away!==undefined&&p.away!==''?p.away:''}" placeholder="0" oninput="onKoScoreInput('${match.id}')">`

  // Render all cards in correct bracket order
  const cL  = bkL.map(m=>bracketCard(m,'roundOf32'));
  const cQFL= bkQFL.map(m=>bracketCard(m,'quarterFinals'));
  const cSFL= bkSFL.map(m=>bracketCard(m,'cuartos'));
  const cSF2L= bracketCard(bkSF2L,'semiFinals');
  const cR  = bkR.map(m=>bracketCard(m,'roundOf32'));
  const cQFR= bkQFR.map(m=>bracketCard(m,'quarterFinals'));
  const cSFR= bkSFR.map(m=>bracketCard(m,'cuartos'));
  const cSF2R= bracketCard(bkSF2R,'semiFinals');
  const cFin= bracketCard(ko.final,'final','bk-final-card');
  const cTP = bracketCard(ko.thirdPlace,'thirdPlace','bk-tp-card');

  html+=`
  <div class="bk-wrapper" id="bk-wrapper-pred">
    <div class="bk-scroll">
      <div class="bk-scale-wrap" id="bk-scale-pred">
      <div class="bk-bracket">

        <div class="bk-col" id="bkc-l32">${cL.join('')}</div>
        <div class="bk-col" id="bkc-lqf">${cQFL.join('')}</div>
        <div class="bk-col" id="bkc-lsf">${cSFL.join('')}</div>
        <div class="bk-col" id="bkc-lsf2">${cSF2L}</div>

        <div class="bk-col bk-center-col">
          <div class="bk-center-title">${t('resFinalTitle')}</div>
          ${cFin}
          <div class="bk-center-title" style="margin-top:1.25rem;color:#cd7f32">${t('res3rdTitle')}</div>
          ${cTP}
        </div>

        <div class="bk-col" id="bkc-rsf2">${cSF2R}</div>
        <div class="bk-col" id="bkc-rsf">${cSFR.join('')}</div>
        <div class="bk-col" id="bkc-rqf">${cQFR.join('')}</div>
        <div class="bk-col" id="bkc-r32">${cR.join('')}</div>

      </div>
      <div class="bk-col-headers">
        <div>${t('bk16')}</div><div>${t('bk8')}</div><div>${t('bk4')}</div><div>${t('bkSemis')}</div>
        <div style="color:var(--gold)">${t('bkFinal')}</div>
        <div>${t('bkSemis')}</div><div>${t('bk4')}</div><div>${t('bk8')}</div><div>${t('bk16')}</div>
      </div>
      </div><!-- end bk-scale-wrap -->
    </div>
  </div>`;
  // Apply scale after render
  html+=`<script>requestAnimationFrame(()=>scaleBracket('bk-wrapper-pred','bk-scale-pred'));<\/script>`;
  // Podio predicho — debajo del bracket, igual que el podio de resultados
  html+=`${(()=>{
    const finP=pred.knockoutMatches?.['FIN']||{};
    const tpP=pred.knockoutMatches?.['3P']||{};
    // Resolver equipos desde el bracket predicho usando winnerByMn ya calculado
    // winnerByMn[mn] contiene el ganador predicho de cada partido por número de match
    const sf5P=pred.knockoutMatches?.['SF5']||{};
    const sf6P=pred.knockoutMatches?.['SF6']||{};
    function predWinnerOf(p, htSlotMn, atSlotMn){
      const ht=winnerByMn[htSlotMn]||p.homeTeam||'';
      const at=winnerByMn[atSlotMn]||p.awayTeam||'';
      const h=parseInt(p.home), a=parseInt(p.away);
      if(isNaN(h)||isNaN(a)) return {w:'',l:''};
      const w=h>a?ht:a>h?at:p.penaltyWinner||'';
      const l=w===ht?at:ht;
      return {w,l};
    }
    const sf5res=predWinnerOf(sf5P,97,98);
    const sf6res=predWinnerOf(sf6P,99,100);
    const finH=sf5res.w||finP.homeTeam||'';
    const finA=sf6res.w||finP.awayTeam||'';
    const fH=parseInt(finP.home), fA=parseInt(finP.away);
    const champion=!isNaN(fH)&&!isNaN(fA)?(fH>fA?finH:fA>fH?finA:finP.penaltyWinner||''):'';
    const runnerUp=champion===finH?finA:finH;
    const tpH_team=sf5res.l||tpP.homeTeam||'';
    const tpA_team=sf6res.l||tpP.awayTeam||'';
    const tpH=parseInt(tpP.home), tpA=parseInt(tpP.away);
    const third=!isNaN(tpH)&&!isNaN(tpA)?(tpH>tpA?tpH_team:tpA>tpH?tpA_team:tpP.penaltyWinner||''):'';
    const fourth=third===tpH_team?tpA_team:tpH_team;
    if(!champion&&!third) return '';
    function podTeamP(id,label,medal,height,color){
      const team=getTeam(id);

        +'<div style="font-size:1.5rem">'+medal+'</div>'
        +(id?flagImg(id,'flag-img-lg'):'')
        +'<div style="font-size:0.78rem;font-weight:700;color:'+color+';text-align:center;max-width:80px;line-height:1.2">'+name+'</div>'
        +'<div style="width:80px;height:'+height+'px;background:'+color+';opacity:0.25;border-radius:6px 6px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:6px">'
        +'<span style="font-size:0.7rem;font-weight:700;color:'+color+';opacity:1">'+label+'</span>'
        +'</div></div>';
    }
    return '<div style="margin:1.5rem auto 0;max-width:360px;background:rgba(234,88,12,0.07);border:1px solid rgba(234,88,12,0.3);border-radius:14px;padding:1.25rem 1rem 0;text-align:center">'
      +'<div style="font-family:\'Bebas Neue\',sans-serif;font-size:1.3rem;letter-spacing:2px;color:#fb923c;margin-bottom:1rem">🏆 PODIO PREDICHO</div>'
      +'<div style="display:flex;justify-content:center;align-items:flex-end;gap:1.5rem">'
      +podTeamP(runnerUp,'2°','🥈',80,'#94a3b8')
      +podTeamP(champion,'1°','🥇',110,'#f59e0b')
      +podTeamP(third,'3°','🥉',60,'#cd7f32')
      +(fourth?podTeamP(fourth,'4°','4️⃣',45,'#64748b'):'')
      +'</div>'
      +'<div style="height:4px;background:linear-gradient(90deg,rgba(234,88,12,0.2),rgba(245,158,11,0.4),rgba(234,88,12,0.2));border-radius:0 0 8px 8px;margin-top:0"></div>'
      +'</div>';
  })()}`;

  if(!readonly&&!koEffectivelyLocked){
    // Bottom save bar (mirrors top sticky bar)
    html+=`<div class="save-bar" style="gap:0.75rem;flex-wrap:wrap;margin-top:1rem">
      <button class="btn btn-outline btn-lg" onclick="saveKnockoutPredictions(false)">💾 ${t('savePredictions')}</button>
      <button class="btn btn-gold btn-lg" onclick="saveKnockoutPredictions(true)">🔒 Enviar eliminatoria</button>
    </div>`;
  }
  return html;
}

/**
 * Renders a knockout match row with:
 * - Auto-filled teams (from bracket progression)
 * - Score inputs
 * - Draw → penalty winner selector (radio buttons)
 * - Real result + points badge if available

function renderKoMatchWithProgression(match, pred, result, pts, phase, winnerByMn, locked=false){
  const hTeam=getTeam(pred.homeTeam);
  const aTeam=getTeam(pred.awayTeam);
  const hName=hTeam?.name[currentLang]||pred.homeTeam||'?';
  const aName=aTeam?.name[currentLang]||pred.awayTeam||'?';
  const hFlag=pred.homeTeam?flagImg(pred.homeTeam,'flag-img'):'<span style="font-size:1.1rem">🏳️</span>';
  const aFlag=pred.awayTeam?flagImg(pred.awayTeam,'flag-img'):'<span style="font-size:1.1rem">🏳️</span>';

  let badge='', statusClass='';
  const rules=getGameScoringRules()[phase]||{};
  const bonusPoints = rules.correctBracketBonus||0;

  if(result&&result.home!==undefined){
    const st=calcKoMatchStatus(pred.home,pred.away,result.home,result.away,
      pred.homeTeam||result.homeTeam||'',pred.awayTeam||result.awayTeam||'',
      result.homeTeam||'',result.awayTeam||'');
    if(st==='exact'){statusClass='exact';badge=`<span class="pts-badge exact">+${pts}</span>`;}
    else if(st==='resultAndGoals'){statusClass='result-goals';badge=`<span class="pts-badge result-goals">+${pts}</span>`;}
    else if(st==='resultOnly'){statusClass='result-only';badge=`<span class="pts-badge result-only">+${pts}</span>`;}
    else{statusClass='wrong';badge=`<span class="pts-badge wrong">0</span>`;}

    // Bracket bonus: acertar el enfrentamiento (quién vs quién), no el resultado
    if(bonusPoints>0&&pred.homeTeam&&pred.awayTeam&&result.homeTeam&&result.awayTeam){
      const bracketMatch=(result.homeTeam===pred.homeTeam&&result.awayTeam===pred.awayTeam)
                       ||(result.homeTeam===pred.awayTeam&&result.awayTeam===pred.homeTeam);
      badge+=bracketMatch
        ? `<span class="pts-badge exact" style="background:rgba(59,130,246,0.2)">+${bonusPoints} ⚔️ ✓</span>`
        : ''; // no badge when wrong
    }
  } else if(bonusPoints>0&&pred.homeTeam&&pred.awayTeam){
    // Show pending bonus if we know the matchup but no result yet
    badge+=`<span style="font-size:0.65rem;color:var(--gray-400)">llave: +${bonusPoints} si coincide</span>`;
  }

  // Draw detection for penalty selector
  const hVal=pred.home!==undefined&&pred.home!==''?parseInt(pred.home):null;
  const aVal=pred.away!==undefined&&pred.away!==''?parseInt(pred.away):null;
  const isDraw=(hVal!==null&&aVal!==null&&hVal===aVal);
  const penSel=isDraw&&pred.homeTeam&&pred.awayTeam?`
    <div style="margin-top:0.4rem;padding:0.35rem 0.6rem;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:6px;font-size:0.75rem;color:var(--gold)">
      ⚽ Empate — ¿Quién avanza por penales?
      <div style="display:flex;gap:0.75rem;margin-top:0.3rem;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:0.35rem;cursor:pointer">
          <input type="radio" name="pen_${match.id}" value="${pred.homeTeam}"
            ${pred.penaltyWinner===pred.homeTeam?'checked':''}
            onchange="setPenaltyWinner('${match.id}','${pred.homeTeam}')">
          ${hFlag}<span>${hName}</span>
        </label>
        <label style="display:flex;align-items:center;gap:0.35rem;cursor:pointer">
          <input type="radio" name="pen_${match.id}" value="${pred.awayTeam}"
            ${pred.penaltyWinner===pred.awayTeam?'checked':''}
            onchange="setPenaltyWinner('${match.id}','${pred.awayTeam}')">
          ${aFlag}<span>${aName}</span>
        </label>
      </div>
    </div>`:
  (isDraw&&(!pred.homeTeam||!pred.awayTeam)?`<div style="margin-top:0.35rem;font-size:0.72rem;color:rgba(245,158,11,0.7)">⚠️ Empate — define primero los equipos en rondas anteriores</div>`:''  );

  return `<div class="match-row knockout-row ${statusClass}" style="flex-direction:column;gap:0.4rem">
    <div style="font-size:0.7rem;color:var(--gray-400)">#${match.mn} · ${fmtDate(match.date)}</div>
    <div style="display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:0.3rem;flex:1;justify-content:flex-end;min-width:100px">
        <span style="font-size:0.85rem;text-align:right">${hName}</span>
        ${hFlag}
      </div>
      <div class="score-inputs">
        <input type="number" min="0" max="30" class="score-input" id="pred_${match.id}_home"
          value="${pred.home!==undefined&&pred.home!==''?pred.home:''}" placeholder="0"
          oninput="onKoScoreInput('${match.id}')">
        <span class="score-sep">—</span>
        <input type="number" min="0" max="30" class="score-input" id="pred_${match.id}_away"
          value="${pred.away!==undefined&&pred.away!==''?pred.away:''}" placeholder="0"
          oninput="onKoScoreInput('${match.id}')">
      </div>
      <div style="display:flex;align-items:center;gap:0.3rem;flex:1;min-width:100px">
        ${aFlag}
        <span style="font-size:0.85rem">${aName}</span>
      </div>
    </div>
    ${penSel}
    ${result&&result.home!==undefined?`<div style="font-size:0.72rem;color:var(--gray-400)">✅ Resultado oficial: ${result.home}—${result.away}</div>`:''}
    ${badge}
  </div>`;
}

function setPenaltyWinner(matchId, teamId){
  const game=currentGame(); if(!game||!currentParticipant) return;
  if(!game.predictionsCache) game.predictionsCache={};
  if(!game.predictionsCache[currentParticipant]) game.predictionsCache[currentParticipant]={groupMatches:{},knockoutMatches:{}};
  if(!game.predictionsCache[currentParticipant].knockoutMatches) game.predictionsCache[currentParticipant].knockoutMatches={};
  if(!game.predictionsCache[currentParticipant].knockoutMatches[matchId])
    game.predictionsCache[currentParticipant].knockoutMatches[matchId]={};
  game.predictionsCache[currentParticipant].knockoutMatches[matchId].penaltyWinner=teamId;
  // Re-render KO tab so the winner cascades to the next round automatically
  const el=document.getElementById('pred-tab-knockout');
  if(el){
    const pred=game.predictionsCache[currentParticipant];
    el.innerHTML=renderKnockoutPredictions(pred,currentParticipant!==authUserId,
      pred.groupsSubmitted||false, game.gameType||'A');
  }
}

function onKoScoreInput(matchId){
  const hEl=document.getElementById(`pred_${matchId}_home`);
  const aEl=document.getElementById(`pred_${matchId}_away`);
  if(!hEl||!aEl) return;
  const game=currentGame(); if(!game||!currentParticipant) return;
  if(!game.predictionsCache) game.predictionsCache={};
  if(!game.predictionsCache[currentParticipant]) game.predictionsCache[currentParticipant]={groupMatches:{},knockoutMatches:{}};
  const km=game.predictionsCache[currentParticipant].knockoutMatches;
  if(!km) return;
  if(!km[matchId]) km[matchId]={};
  km[matchId].home=hEl.value===''?'':parseInt(hEl.value);
  km[matchId].away=aEl.value===''?'':parseInt(aEl.value);
  // Re-render KO tab: winner cascades, penalty selector appears on draw
  const el=document.getElementById('pred-tab-knockout');
  if(el){
    const pred=game.predictionsCache[currentParticipant];
    el.innerHTML=renderKnockoutPredictions(pred,currentParticipant!==authUserId,
      pred.groupsSubmitted||false, game.gameType||'A');
  }
}

function updateKoTeam(matchId,side,teamId){
  if(!currentParticipant) return;
  const game=currentGame(); if(!game) return;
  if(!game.predictionsCache) game.predictionsCache={};
  if(!game.predictionsCache[currentParticipant]) game.predictionsCache[currentParticipant]={groupMatches:{},knockoutMatches:{}};
  if(!game.predictionsCache[currentParticipant].knockoutMatches) game.predictionsCache[currentParticipant].knockoutMatches={};
  if(!game.predictionsCache[currentParticipant].knockoutMatches[matchId])
    game.predictionsCache[currentParticipant].knockoutMatches[matchId]={homeTeam:'',awayTeam:''};
  game.predictionsCache[currentParticipant].knockoutMatches[matchId][side==='home'?'homeTeam':'awayTeam']=teamId;
}

async function saveKnockoutPredictions(submit=false){
  if(!isLoggedIn()||currentParticipant!==authUserId){
    showToast('Solo puedes guardar tus propios pronósticos','error'); return;
  }
  const game=currentGame(); if(!game) return;
  // Bloquear si el admin ya guardó algún resultado de eliminatoria
  const results_check=getResults();
  if(Object.keys(results_check.knockoutMatches||{}).length > 0){
    showToast('⛔ La eliminatoria ya comenzó — pronósticos bloqueados','error'); return;
  }
  const pred=game.predictionsCache?.[authUserId]||{groupMatches:{},knockoutMatches:{}};
  const gameType=game.gameType||'A';
  const results_k=getResults();

  // Re-build real slot resolution so we can attach correct homeTeam/awayTeam
  const realGS_sv=buildRealGroupStandings();
  const thirdsReal_sv=getBestThirdPlaces(results_k,null,false);
  const realThirdsSlots_sv=assignThirdsToSlots(thirdsReal_sv.all);
  const realWinnerByMn_sv={};
  const allKo=[...KNOCKOUT_MATCHES.roundOf32,...KNOCKOUT_MATCHES.quarterFinals,
    ...KNOCKOUT_MATCHES.semiFinals,...(KNOCKOUT_MATCHES.semiFinals2||[]),
    KNOCKOUT_MATCHES.thirdPlace,KNOCKOUT_MATCHES.final];

  // Build realWinner map from actual admin results
  allKo.forEach(m=>{
    const rr=results_k.knockoutMatches?.[m.id];
    if(rr&&rr.home!==undefined){
      const w=rr.home>rr.away?rr.homeTeam:rr.away>rr.home?rr.awayTeam:rr.penaltyWinner||'';
      if(w) realWinnerByMn_sv[m.mn]=w;
    }
  });

  function resolveSlotSave(slot,matchId,winnerByMnUser){
    if(!slot) return '';
    const mW=slot.match(/^W(\d+)$/);
    if(mW) return winnerByMnUser[parseInt(mW[1])]||realWinnerByMn_sv[parseInt(mW[1])]||'';
    const mL=slot.match(/^L(\d+)$/);
    if(mL){
      const prev=allKo.find(m=>m.mn===parseInt(mL[1]));
      if(!prev) return '';
      const pr=results_k.knockoutMatches?.[prev.id];
      if(pr&&pr.home!==undefined){
        if(pr.home>pr.away) return pr.awayTeam||'';
        if(pr.away>pr.home) return pr.homeTeam||'';
        const pw=pr.penaltyWinner||'';
        return pw===pr.homeTeam?pr.awayTeam||'':pr.homeTeam||'';
      }
      const pp=pred.knockoutMatches?.[prev.id];
      if(!pp||pp.home===undefined||pp.home==='') return '';
      if(parseInt(pp.home)>parseInt(pp.away)) return pp.awayTeam||'';
      if(parseInt(pp.away)>parseInt(pp.home)) return pp.homeTeam||'';
      const ppw=pp.penaltyWinner||'';
      return ppw===pp.homeTeam?pp.awayTeam||'':pp.homeTeam||'';
    }
    return resolveRealSlotTeam(slot,matchId,realGS_sv,realThirdsSlots_sv);
  }

  const knockoutMatches={};
  const matchDates={};
  const winnerByMnUser={};

  allKo.forEach(match=>{
    const h=document.getElementById(`pred_${match.id}_home`);
    const a=document.getElementById(`pred_${match.id}_away`);
    const hVal=h?.value; const aVal=a?.value;

    // Resolve homeTeam/awayTeam from bracket progression
    const homeTeamId=resolveSlotSave(match.hs,match.id,winnerByMnUser);
    const awayTeamId=resolveSlotSave(match.as,match.id,winnerByMnUser);

    // Get penalty winner from cached pred
    const existingP=pred.knockoutMatches?.[match.id]||{};
    const penWinner=existingP.penaltyWinner||'';

    const entry={homeTeam:homeTeamId,awayTeam:awayTeamId,penaltyWinner:penWinner};

    // Use DOM value if available, otherwise fall back to cached score
    // BUT only keep cached score if the teams still match (avoid stale scores from old bracket)
    if(hVal!==undefined&&hVal!==''){
      entry.home=parseInt(hVal);
    } else if(existingP.home!==undefined&&existingP.homeTeam===homeTeamId){
      entry.home=existingP.home;
    }
    if(aVal!==undefined&&aVal!==''){
      entry.away=parseInt(aVal);
    } else if(existingP.away!==undefined&&existingP.awayTeam===awayTeamId){
      entry.away=existingP.away;
    }
    knockoutMatches[match.id]=entry;
    if(match.date) matchDates[match.id]=match.date;

    // Cascade winner for next rounds
    if(entry.home!==undefined&&entry.away!==undefined){
      const wi=entry.home>entry.away?homeTeamId:entry.away>entry.home?awayTeamId:penWinner;
      if(wi) winnerByMnUser[match.mn]=wi;
    }
  });

  // Validate if submitting: all matches with known teams must have scores + draws need penalty winner
  if(submit && gameType==='A'){
    const missing=[];
    const missingPenalty=[];

    allKo.forEach(m=>{
      const e=knockoutMatches[m.id];
      // Only validate if both teams are known (admin has set the bracket)
      if(!e?.homeTeam||!e?.awayTeam) return;
      if(e.home===undefined||e.away===undefined){
        missing.push(m);
      } else if(parseInt(e.home)===parseInt(e.away)&&!e.penaltyWinner){
        missingPenalty.push(m);
      }
    });

    if(missing.length>0||missingPenalty.length>0){
      // Build a clear error modal with specifics
      const phaseLabel={
        roundOf32:'R32',quarterFinals:'QF',semiFinals:'SF',semiFinals2:'SF2',
        thirdPlace:'3er Lugar',final:'Final'
      };
      function getPhase(matchId){
        if(KNOCKOUT_MATCHES.roundOf32.find(m=>m.id===matchId)) return 'R32';
        if(KNOCKOUT_MATCHES.quarterFinals.find(m=>m.id===matchId)) return 'QF';
        if(KNOCKOUT_MATCHES.semiFinals.find(m=>m.id===matchId)) return 'SF';
        if((KNOCKOUT_MATCHES.semiFinals2||[]).find(m=>m.id===matchId)) return 'SF2';
        if(KNOCKOUT_MATCHES.thirdPlace.id===matchId) return '3er Lugar';
        if(KNOCKOUT_MATCHES.final.id===matchId) return 'Final';
        return '';
      }
      function teamName(id){ const t=getTeam(id); return t?t.name[currentLang]||t.name.es:id||'?'; }

      let html=`<div style="font-family:'Barlow',sans-serif;color:var(--white)">
        <div style="font-size:1.1rem;font-weight:700;color:var(--gold);margin-bottom:0.75rem">⚠️ Pronósticos incompletos</div>
        <div style="font-size:0.85rem;color:var(--gray-400);margin-bottom:1rem">
          Completa todos los marcadores y los definidores de penales antes de enviar.
        </div>`;

      if(missing.length>0){
        html+=`<div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:0.6rem 0.8rem;margin-bottom:0.75rem">
          <div style="font-size:0.82rem;font-weight:700;color:var(--red);margin-bottom:0.4rem">❌ Sin marcador (${missing.length})</div>
          ${missing.map(m=>{
            const e=knockoutMatches[m.id];
            return `<div style="font-size:0.78rem;padding:0.2rem 0;border-top:1px solid rgba(255,255,255,0.05);color:var(--white)">
              <span style="color:var(--gray-400);font-size:0.7rem">#${m.mn} ${getPhase(m.id)} · </span>
              ${teamName(e.homeTeam)} <span style="color:var(--gray-400)">vs</span> ${teamName(e.awayTeam)}
            </div>`;
          }).join('')}
        </div>`;
      }

      if(missingPenalty.length>0){
        html+=`<div style="background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:8px;padding:0.6rem 0.8rem;margin-bottom:0.75rem">
          <div style="font-size:0.82rem;font-weight:700;color:var(--gold);margin-bottom:0.4rem">⚽ Empate sin definir ganador por penales (${missingPenalty.length})</div>
          ${missingPenalty.map(m=>{
            const e=knockoutMatches[m.id];
            return `<div style="font-size:0.78rem;padding:0.2rem 0;border-top:1px solid rgba(255,255,255,0.05);color:var(--white)">
              <span style="color:var(--gray-400);font-size:0.7rem">#${m.mn} ${getPhase(m.id)} · </span>
              ${teamName(e.homeTeam)} <span style="color:var(--gold);font-weight:700">${e.home}—${e.away}</span> ${teamName(e.awayTeam)}
              <span style="font-size:0.7rem;color:var(--gold)"> → selecciona quién avanza por penales</span>
            </div>`;
          }).join('')}
        </div>`;
      }

      html+=`<div style="text-align:right;margin-top:0.5rem">
        <button class="btn btn-gold" onclick="closeModal()">✏️ Completar pronósticos</button>
      </div></div>`;

      openModal(html);
      return;
    }

    if(!confirm('¿Enviar todos tus pronósticos de eliminatoria? No podrán modificarse después.')) return;
  }

  try{
    const res=await apiPost(`/api/predictions/${game.id}`,{
      groupMatches:{}, knockoutMatches, matchDates,
      submitGroups:false, submitKnockouts:submit
    });
    if(!game.predictionsCache) game.predictionsCache={};
    if(!game.predictionsCache[authUserId]) game.predictionsCache[authUserId]={groupMatches:{},knockoutMatches:{}};
    if(!game.predictionsCache[authUserId].knockoutMatches) game.predictionsCache[authUserId].knockoutMatches={};
    Object.assign(game.predictionsCache[authUserId].knockoutMatches, knockoutMatches);
    if(submit){
      game.predictionsCache[authUserId].knockoutsSubmitted=true;
      // Al enviar en firme, limpiar el flag de pruebas para que el bloqueo vuelva a ser normal
      delete game._testUnlockKo;
      showToast('🔒 Pronósticos de eliminatoria enviados y bloqueados ✓','success');
    } else {
      showToast(t('predictionsSaved'),'success');
    }
    // Re-render KO tab to show updated state
    const el=document.getElementById('pred-tab-knockout');
    if(el){
      const predUp=game.predictionsCache[authUserId];
      el.innerHTML=renderKnockoutPredictions(predUp,currentParticipant!==authUserId,predUp.groupsSubmitted||false,gameType);
    }
  }catch(e){ showToast(e.message||'Error al guardar pronósticos eliminatorios','error'); }
}

function calcGroupStandingsFromResults(groupId, results){
  const teams = TEAMS
    .filter(t => t.group == groupId)
    .map(t => ({ id:t.id, pts:0, gf:0, ga:0, gd:0, pj:0, w:0, d:0, l:0 }));

  const gMatches = GROUP_MATCHES.filter(m => m.group == groupId);

  // Procesar partidos reales
  gMatches.forEach(match => {
    const r = results.groupMatches[match.id];
    if(r && r.home !== undefined && r.away !== undefined){
      const h = parseInt(r.home), a = parseInt(r.away);
      const ht = teams.find(t => t.id == match.home);
      const at = teams.find(t => t.id == match.away);
      if(!ht || !at) return;

      ht.pj++; at.pj++;
      ht.gf += h; ht.ga += a;
      at.gf += a; at.ga += h;
      ht.gd = ht.gf - ht.ga;
      at.gd = at.gf - at.ga;

      if(h > a){ ht.pts += 3; ht.w++; at.l++; }
      else if(a > h){ at.pts += 3; at.w++; ht.l++; }
      else { ht.pts++; at.pts++; ht.d++; at.d++; }
    }
  });

  // Mini‑tabla para empates
  function buildMiniTable(tied){
    const mini = tied.map(t => ({ id:t.id, pts:0, gf:0, ga:0, gd:0 }));

    gMatches.forEach(m => {
      const H = mini.find(x => x.id === m.home);
      const A = mini.find(x => x.id === m.away);
      if(!H || !A) return;

      const r = results.groupMatches[m.id];
      if(!r || r.home === undefined) return;

      const h = parseInt(r.home), a = parseInt(r.away);

      H.gf += h; H.ga += a;
      A.gf += a; A.ga += h;
      H.gd = H.gf - H.ga;
      A.gd = A.gf - A.ga;

      if(h > a) H.pts += 3;
      else if(a > h) A.pts += 3;
      else { H.pts++; A.pts++; }
    });

    return mini;
  }

  // ORDEN FIFA 2026
  const sorted = teams.sort((a,b)=>{

    // 1. Puntos globales
    if(b.pts !== a.pts) return b.pts - a.pts;

    // Detectar equipos empatados
    const tied = teams.filter(t => t.pts === a.pts);

    if(tied.length > 1){
      const mini = buildMiniTable(tied);
      const Amini = mini.find(x => x.id === a.id);
      const Bmini = mini.find(x => x.id === b.id);

      // 2. Puntos en mini‑tabla
      if(Bmini.pts !== Amini.pts) return Bmini.pts - Amini.pts;

      // 3. DIF en mini‑tabla
      if(Bmini.gd !== Amini.gd) return Bmini.gd - Amini.gd;

      // 4. GF en mini‑tabla
      if(Bmini.gf !== Amini.gf) return Bmini.gf - Amini.gf;
    }

    // 5. DIF global
    if(b.gd !== a.gd) return b.gd - a.gd;

    // 6. GF global
    if(b.gf !== a.gf) return b.gf - a.gf;

    return 0;
  });

  // 👇 ESTA ES LA LÍNEA QUE TE FALTABA
  return sorted.map((t, i) => ({ ...t, pos: i + 1 }));
}

function resolveRealSlotTeam(slot, matchId, realGS, realThirdsSlots){
  if(!slot) return '';
  const m12=slot.match(/^([12])([A-L])$/);
  if(m12){ const st=realGS[m12[2]]||[]; return st[parseInt(m12[1])-1]?.pj>0?st[parseInt(m12[1])-1].id:''; }
  if(slot.startsWith('3')) return realThirdsSlots[matchId]||'';
  return '';
}

function buildWinnerMap(results){
  const ko = KNOCKOUT_MATCHES;
  const winnerMap = {};

  const all = [
    ...ko.roundOf32,
    ...ko.quarterFinals,
    ...ko.semiFinals,
    ...(ko.semiFinals2 || []),
    ko.thirdPlace,
    ko.final
  ];

  all.forEach(match => {
    const r = results.knockoutMatches?.[match.id];
    if(!r || r.home == null) return;  // null or undefined

    let winner = null;

    if(r.home > r.away) winner = r.homeTeam;
    else if(r.away > r.home) winner = r.awayTeam;
    else if(r.home === r.away && r.penaltyWinner){
      winner = r.penaltyWinner;
    }

    if(winner){
      winnerMap[match.mn] = winner;
    }
  });

  return winnerMap;
}

function renderKnockoutResultsHtml(results){
  const ko=KNOCKOUT_MATCHES;
  const realGS=buildRealGroupStandings();
  const thirdsReal=getBestThirdPlaces(results,null,false);
  const realThirdsSlots=assignThirdsToSlots(thirdsReal.all);
  const winnerMap={};
  [...ko.roundOf32,...ko.quarterFinals,...ko.semiFinals,...(ko.semiFinals2||[])].forEach(m=>{
    const rr=results.knockoutMatches?.[m.id];
    if(rr&&rr.home!==undefined){
      const w=rr.home>rr.away?rr.homeTeam:rr.away>rr.home?rr.awayTeam:rr.penaltyWinner||'';
      if(w) winnerMap[m.mn]=w;
    }
  });
  function resolveSlot(slot,mid){
    if(!slot) return '';
    const mW=slot.match(/^W(\d+)$/); if(mW) return winnerMap[parseInt(mW[1])]||'';
    const mL=slot.match(/^L(\d+)$/); if(mL){
      const prev=[...ko.roundOf32,...ko.quarterFinals,...ko.semiFinals,...(ko.semiFinals2||[])].find(m=>m.mn===parseInt(mL[1]));
      if(!prev) return '';
      const pr=results.knockoutMatches?.[prev.id];
      if(!pr||pr.home===undefined) return '';
      if(pr.home>pr.away) return pr.awayTeam||'';
      if(pr.away>pr.home) return pr.homeTeam||'';
      const pw=pr.penaltyWinner||'';
      return pw===pr.homeTeam?pr.awayTeam||'':pr.homeTeam||'';
    }
    const fromGS=resolveRealSlotTeam(slot,mid,realGS,realThirdsSlots);
    if(fromGS) return fromGS;
    const adminR=results.knockoutMatches?.[mid];
    if(adminR){
      const allFlat=[...ko.roundOf32,...ko.quarterFinals,...ko.semiFinals,...(ko.semiFinals2||[]),ko.thirdPlace,ko.final];
      const km=allFlat.find(m=>m.id===mid);
      if(km){ if(km.hs===slot) return adminR.homeTeam||''; if(km.as===slot) return adminR.awayTeam||''; }
    }
    return '';
  }

  function resCard(match){
    const r=results.knockoutMatches?.[match.id];
    const hId=r?.homeTeam||resolveSlot(match.hs,match.id);
    const aId=r?.awayTeam||resolveSlot(match.as,match.id);
    const hKnown=!!hId; const aKnown=!!aId;
    const hName=hId||(match.hs?.match(/^[WL]\d+$/)?match.hs:'—');
    const aName=aId||(match.as?.match(/^[WL]\d+$/)?match.as:'—');
    const hFlag=hKnown?flagImg(hId,'flag-img'):'';
    const aFlag=aKnown?flagImg(aId,'flag-img'):'';
    const played=r&&r.home!==undefined;
    const realWinner=played?(r.home>r.away?r.homeTeam:r.away>r.home?r.awayTeam:r.penaltyWinner||''):null;
    const hBg=realWinner===hId?'background:rgba(34,197,94,0.15)':'';
    const aBg=realWinner===aId?'background:rgba(34,197,94,0.15)':'';
    const mnLabel=match.mn?`#${match.mn}`:'';
    return `<div class="bk-card ${played?'bk-played':''}" style="${played?'border-left:3px solid rgba(34,197,94,0.5)':''}">
      <div class="bk-date"><span class="bk-mn">${mnLabel}</span><span class="bk-dt">${fmtDate(match.date)}</span></div>
      <div class="bk-match-inner">
        <div class="bk-team-row" style="${hBg}">
          <div class="team-display">${hFlag}<span class="tname bk-tname" style="${!hKnown?'color:var(--gray-400);font-size:0.63rem':''}">${hName}</span></div>
          <span class="bk-score-locked" style="${realWinner===hId?'color:var(--green-light);font-weight:800':''}">${played?r.home:'—'}</span>
        </div>
        <div class="bk-vs-line"></div>
        <div class="bk-team-row" style="${aBg}">
          <div class="team-display">${aFlag}<span class="tname bk-tname" style="${!aKnown?'color:var(--gray-400);font-size:0.63rem':''}">${aName}</span></div>
          <span class="bk-score-locked" style="${realWinner===aId?'color:var(--green-light);font-weight:800':''}">${played?r.away:'—'}</span>
        </div>
      </div>
      ${played&&r.penaltyWinner?`<div class="bk-official">${t('resPenalties')} ${r.penaltyWinner}</div>`:''}
    </div>`;
  }

  function byMnR(mn){return [...ko.roundOf32,...ko.quarterFinals,...ko.semiFinals,...(ko.semiFinals2||[])].find(m=>m.mn===mn)||(ko.thirdPlace.mn===mn?ko.thirdPlace:null)||(ko.final.mn===mn?ko.final:null);}

  // IZQUIERDA: P73,P75,P74,P77,P83,P84,P81,P82 → QF: P90,P89,P93,P94 → SF: P97,P98 → SF2: P101
  const bkL=[73,75,74,77,83,84,81,82].map(n=>byMnR(n));

async function renderStandings(){
  const container=document.getElementById('standings-content');

  // Show loading while fetching
  container.innerHTML=`<div class="section-header"><h2>🏅 ${t('standings')}</h2></div>
    <div style="text-align:center;padding:3rem;color:var(--gray-400)">⏳ ${t('standings')}...</div>`;

  const game=currentGame();
  if(!game){
    container.innerHTML=`<div class="section-header"><h2>🏅 ${t('standings')}</h2></div>
      <div class="empty-state-card"><p>${t('noParticipants')}</p></div>`;
    return;
  }

  // Load predictions for all members — always reload to get fresh knockoutsSubmitted status
  const members=game.members||[];
  await Promise.allSettled(members.map(m=>loadUserPredictions(game.id, m.userId)));

  const participants=getParticipants(); // members: [{userId, username, ...}]

  const standings=participants.map(p=>{
    const uid=p.userId||p.id;
    const {total,phaseBreakdown,counts,bracketCount}=calcParticipantTotal(uid);
    const isMe=uid===authUserId;
    return {id:uid,name:p.username||p.name||uid,total,phaseBreakdown,counts,bracketCount:bracketCount||0,isMe};
  }).sort((a,b)=>b.total-a.total);

  const filterOpts=[
    {k:'total',label:'Total Pts'},
    {k:'exact',label:'✅ Exactos'},
    {k:'resultAndGoals',label:'🔵 Res+Goles'},
    {k:'resultOnly',label:'🟡 Solo Res'},
    {k:'wrong',label:'❌ Fallados'},
  ];

  // Mostrar todos los participantes (sin restriccion premium)
  const myPos=standings.findIndex(s=>s.isMe);
  const freeRows=standings;
  const isPremium=true;

  container.innerHTML=`
    <div class="section-header"><h2>🏅 ${t('standings')}</h2></div>
    ${standings.length===0?`<div class="empty-state-card"><p>${t('noParticipants')}</p></div>`:`
    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center">
      <span style="font-size:0.8rem;color:var(--gray-400)">${t('standSortBy')}</span>
      ${filterOpts.map(f=>`<button class="tab-btn${f.k==='total'?' active':''}" onclick="sortStandingsBy('${f.k}',this)" data-sort="${f.k}">${f.label}</button>`).join('')}
    </div>
    <div class="table-wrapper" id="standings-table-wrap">
      ${renderStandingsTable(isPremium?standings:freeRows,'total',myPos,standings.length,isPremium)}
    </div>
    ${false&&standings.length>4?`<div style="background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.25);border-radius:8px;padding:0.6rem 1rem;margin-top:0.75rem;font-size:0.82rem;color:#a78bfa;display:flex;align-items:center;gap:0.5rem">
      👑 <span><strong>Premium</strong> — ${t('standSeeAll')} ${standings.length} ${t('standParticipants')}</span>
    </div>`:''}

    <div style="margin-top:1.5rem">
      <h3 style="font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:700;letter-spacing:1px;margin-bottom:0.75rem">${t('standViewAll')}</h3>
      <div style="position:relative;margin-bottom:0.75rem">
        <input type="text" id="participant-search" class="form-input" placeholder="🔍 Buscar participante..."
          oninput="filterParticipantSearch(this.value)"
          style="padding-right:2.5rem">
        <div id="participant-search-results" style="position:absolute;top:100%;left:0;right:0;background:var(--card-bg);border:1px solid rgba(255,255,255,0.1);border-radius:8px;z-index:100;max-height:200px;overflow-y:auto;display:none"></div>
      </div>
      <div id="participant-detail"></div>
    </div>
    `}
  `;

  // Store data globally for sorting
  window._standingsData=standings;
  window._standingsParticipants=participants;
  window._standingsIsPremium=isPremium;
}

function filterParticipantSearch(query){
  const participants=window._standingsParticipants||[];
  const resultsEl=document.getElementById('participant-search-results');
  if(!resultsEl) return;
  if(!query.trim()){resultsEl.style.display='none';return;}
  const q=query.toLowerCase();
  const matches=participants.filter(p=>(p.username||p.name||'').toLowerCase().includes(q));
  if(matches.length===0){resultsEl.style.display='none';return;}
  resultsEl.style.display='block';
  resultsEl.innerHTML=matches.slice(0,8).map(p=>{
    const uid=p.userId||p.id;
    const nm=p.username||p.name||'';
    const ini=(nm||'?')[0].toUpperCase();
    return `<div data-uid="${uid}" data-nm="${nm.replace(/"/g,'&quot;')}"
      class="search-result-item"
      style="padding:0.5rem 0.75rem;cursor:pointer;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid rgba(255,255,255,0.05)">
      <span class="avatar-sm" style="width:24px;height:24px;font-size:0.7rem">${ini}</span>
      <span>${nm}</span>
    </div>`;
  }).join('');
  resultsEl.querySelectorAll('.search-result-item').forEach(el=>{
    el.addEventListener('click',()=>selectParticipantFromSearch(el.dataset.uid,el.dataset.nm));
    el.addEventListener('mouseover',()=>{el.style.background='rgba(255,255,255,0.06)';});
    el.addEventListener('mouseout',()=>{el.style.background='';});
  });
}

function selectParticipantFromSearch(pid, name){
  document.getElementById('participant-search').value=name;
  document.getElementById('participant-search-results').style.display='none';
  showParticipantDetail(pid);
}

function renderStandingsTable(standings,sortBy,myRealPos=-1,totalCount=0,isPremium=false){
  const sorted=[...standings].sort((a,b)=>{
    if(sortBy==='total') return b.total-a.total;
    if(sortBy==='exact') return b.counts.exact-a.counts.exact;
    if(sortBy==='resultAndGoals') return b.counts.resultAndGoals-a.counts.resultAndGoals;
    if(sortBy==='resultOnly') return b.counts.resultOnly-a.counts.resultOnly;
    if(sortBy==='wrong') return b.counts.wrong-a.counts.wrong;
    return b.total-a.total;
  });

  const rows=sorted.map((s,i)=>{
    const isMe=s.isMe||s.id===authUserId;
    // If showing limited (free) rows, show real rank position
    const rankPos=!isPremium&&myRealPos>=0&&isMe?myRealPos+1:i+1;
    const medal=rankPos===1?'🥇':rankPos===2?'🥈':rankPos===3?'🥉':rankPos;
    const rowClass=rankPos===1?'gold':rankPos===2?'silver':rankPos===3?'bronze':'';
    return `<tr class="${rowClass}" style="${isMe?'outline:1px solid rgba(34,197,94,0.4);background:rgba(34,197,94,0.05)':''}">
      <td class="rank-cell">${medal}</td>
      <td><div class="name-cell">
        <span class="avatar-sm" style="${isMe?'background:linear-gradient(135deg,var(--gold),#d97706);color:var(--dark)':''}">${s.name.charAt(0).toUpperCase()}</span>
        ${s.name}${isMe?` <span style="color:var(--green-light);font-size:0.7rem">(tú)</span>`:''}
      </div></td>
      <td style="color:var(--exact-color);font-weight:700">${s.counts.exact}</td>
      <td style="color:var(--result-goals-color);font-weight:700">${s.counts.resultAndGoals}</td>
      <td style="color:var(--result-only-color);font-weight:700">${s.counts.resultOnly}</td>
      <td style="color:var(--wrong-color)">${s.counts.wrong}</td>
      <td style="color:#60a5fa;font-weight:700" title="Llaves acertadas">${s.bracketCount||0}</td>
      <td class="total-cell"><strong>${s.total}</strong></td>
    </tr>`;
  }).join('');

  return `<table class="standings-table">
    <thead>
      <tr>
        <th>${t('rank')}</th>
        <th>${t('participant')}</th>
        <th title="Marcadores Exactos">${t('standExact')}</th>
        <th title="Resultado + Goles">🔵 Res+Gol</th>
        <th title="Solo Resultado">${t('standSoloRes')}</th>
        <th title="Sin puntos">${t('standNothing')}</th>
        <th title="Llaves Acertadas" style="color:#60a5fa">${t('standKeys')}</th>
        <th>${t('totalPoints')}</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function sortStandingsBy(key,btn){
  document.querySelectorAll('[data-sort]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(window._standingsData){
    const data=window._standingsData;
    const isPremium=window._standingsIsPremium||false;
    const myPos=data.findIndex(s=>s.isMe||s.id===authUserId);
    const freeRows=data.filter((s,i)=>i<3||s.isMe||s.id===authUserId);
    document.getElementById('standings-table-wrap').innerHTML=
      renderStandingsTable(isPremium?data:freeRows,key,myPos,data.length,isPremium);
  }
}

function showParticipantDetail(pid){
  if(!pid){document.getElementById('participant-detail').innerHTML='';return;}
  const participant=getParticipants().find(p=>p.id===pid);
  const pred=(getPredictions()[pid])||{groupMatches:{},knockoutMatches:{}};
  const {total,phaseBreakdown}=calcParticipantTotal(pid);
  const results=getResults();

  let html=`<div class="card" style="margin-top:0.75rem">
    <div class="card-header"><h3>${participant.name}</h3><strong style="color:var(--gold)">${total} pts</strong></div>
    <div class="card-body">
    <div class="phase-breakdown">
      <span>Grupos: ${phaseBreakdown.group}</span>
      <span>Oct: ${phaseBreakdown.roundOf32}</span>
      <span>QF: ${phaseBreakdown.quarterFinals}</span>
      <span>SF: ${phaseBreakdown.semiFinals}</span>
      <span>3P: ${phaseBreakdown.thirdPlace}</span>
      <span>Final: ${phaseBreakdown.final}</span>
    </div>
    ${GROUP_MATCHES.map(match=>{
      const p=pred.groupMatches?.[match.id];
      const r=results.groupMatches[match.id];
      const pts=r&&p?getMatchPoints(match.id,'groupStage',pid):null;
      const st=r&&p?calcScore(p.home,p.away,r.home,r.away):null;
      return `<div class="detail-match-row ${st||''}">
        <span class="dm-teams">${flagImg(match.home,'flag-img-sm')} ${getTeamName(match.home)} vs ${getTeamName(match.away)} ${flagImg(match.away,'flag-img-sm')}</span>
        <span class="dm-pred">${p?`${p.home}—${p.away}`:t('noPredictions')}</span>
        <span class="dm-result">${r?`${r.home}—${r.away}`:'?'}</span>
        <span class="dm-pts">${pts!==null?`+${pts}`:''}</span>
      </div>`;
    }).join('')}
    </div>
  </div>`;

  document.getElementById('participant-detail').innerHTML=html;
}

async function resetAllSubmitted(){

async function _resetSubmittedFlags(mode){
  const game = currentGame();
  if(!game){ showToast('No hay partida activa','error'); return; }
  // Ensure predictionsCache is set on the actual game object (not a copy)
  if(!game.predictionsCache) game.predictionsCache = {};
  const cache = game.predictionsCache;
  const members = game.members || [];

  // Reset local cache (para pruebas funciona de inmediato sin endpoint)
  members.forEach(m => {
    if(!cache[m.userId]) cache[m.userId] = {groupMatches:{}, knockoutMatches:{}};
    if(mode === 'groups' || mode === 'all'){
      cache[m.userId].groupsSubmitted = false;
      m.groupsSubmitted = false;
    }
    if(mode === 'knockouts' || mode === 'all'){
      cache[m.userId].knockoutsSubmitted = false;
      m.knockoutsSubmitted = false;
    }
  });

  // Flag de pruebas: desactiva el bloqueo automático por resultados de admin ya guardados
  if(mode === 'knockouts' || mode === 'all') game._testUnlockKo = true;
  if(mode === 'groups' || mode === 'all') game._testUnlockGroups = true;

  // Intentar persistir vía API (endpoint opcional — si no existe, el reset local igual funciona)
  let persisted = 0;
  await Promise.allSettled(members.map(async m => {
    try {
      await apiAdminPost(`/api/admin/reset-submission/${game.id}/${m.userId}`, { mode });
      persisted++;
    } catch(e) { /* endpoint opcional */ }
  }));

  const label = mode==='groups' ? 'grupos' : mode==='knockouts' ? 'eliminatoria' : 'grupos y eliminatoria';
  const note = persisted < members.length ? ' (local — se restaura al recargar si el servidor no lo soporta)' : '';
  showToast(`✅ ${members.length} participante(s) desbloqueados — ${label}${note}`, persisted===members.length?'success':'info');

  // Refrescar tabla de estado
  const el = document.getElementById('admin-tab-testing');
  if(el) el.innerHTML = renderAdminTesting();

  // Si la vista de pronósticos está activa, re-renderizarla para reflejar el desbloqueo
  const predView = document.getElementById('view-predictions');
  if(predView && predView.classList.contains('active')){
    try{ showView('predictions'); } catch(e){}
  }
}

async function saveDateResults(date){
  const dateMatches=GROUP_MATCHES.filter(m=>m.date===date);
  const matches=[];
  let missing=0;
  dateMatches.forEach(match=>{
    const h=document.getElementById(`admin_${match.id}_home`)?.value;
    const a=document.getElementById(`admin_${match.id}_away`)?.value;
    if(h!==''&&h!==undefined&&a!==''&&a!==undefined){
      matches.push({matchId:match.id,matchType:'group',home:parseInt(h),away:parseInt(a)});
    } else { missing++; }
  });
  if(matches.length===0){ showToast(t('noResultsToSave'),'info'); return; }
  try{
    await apiAdminPost('/api/results',{matches});
    matches.forEach(m=>{ appData.globalResults.groupMatches[m.matchId]={home:m.home,away:m.away}; });
    if(missing>0) showToast(`⚠️ ${matches.length} guardados, ${missing} sin completar`,'info');
    else showToast(`✅ ${matches.length} resultados guardados — ${fmtDate(date)}`,'success');
    renderAdmin();
  } catch(e){ showToast(e.message||'Error al guardar resultados','error'); }
}

function renderAdminKnockoutResults(){
  const results = getResults();
  const winnerMap = buildWinnerMap(results);
  const ko = KNOCKOUT_MATCHES;

  // Todas las rondas en orden
  const allMatches = [
    ...ko.roundOf32,
    ...ko.quarterFinals,
    ...ko.semiFinals,
    ...(ko.semiFinals2 || []),
    ko.thirdPlace,
    ko.final
  ];

  // Datos reales para slots 1A, 2B, 3C, etc.
  const realGS = buildRealGroupStandings();
  const thirdsReal = getBestThirdPlaces(results, null, false);
  const realThirdsSlots = assignThirdsToSlots(thirdsReal.all);

  // Resolver equipo real del slot
 function realSlotAdmin(slot, match){
  if(!slot) return slot; // ← nunca devolver ''

  // Wxx → ganador del partido anterior
  const mW = slot.match(/^W(\d+)$/);
  if(mW){
    const mn = parseInt(mW[1]);
    return winnerMap[mn] || slot;
  }

  // Lxx → perdedor del partido anterior
  const mL = slot.match(/^L(\d+)$/);
  if(mL){
    const prevMn = parseInt(mL[1]);
    const prev = allMatches.find(m => m.mn === prevMn);
    if(!prev) return slot;

    const pr = results.knockoutMatches?.[prev.id];

    // Si no hay resultados → NO inventar nada
    if(!pr || pr.home === undefined) return slot;

    // Ganador por goles
    if(pr.home > pr.away) return pr.awayTeam;
    if(pr.away > pr.home) return pr.homeTeam;

    // Empate → penales
    if(!pr.penaltyWinner) return slot;

    return pr.penaltyWinner === pr.homeTeam
      ? pr.awayTeam
      : pr.homeTeam;
  }

  // Slots normales (equipos directos)
  return resolveRealSlotTeam(slot, match.id, realGS, realThirdsSlots);
}

  const phases = [
    {key:'roundOf32',    label:`🔵 ${t('roundOf32')}`, matches:ko.roundOf32},
    {key:'quarterFinals',label:'🟢 Octavos de Final', matches:ko.quarterFinals},
    {key:'semiFinals',   label:'🟡 Cuartos de Final', matches:ko.semiFinals},
    {key:'semiFinals2',  label:'🟠 Semifinales',      matches:ko.semiFinals2||[]},
    {key:'thirdPlace',   label:`🥉 ${t('thirdPlace')}`, matches:[ko.thirdPlace]},
    {key:'final',        label:`🏆 ${t('final')}`,       matches:[ko.final]},
  ].filter(p => p.matches.length > 0);

  let html = '';

  phases.forEach(phase => {
    const byDate = {};
    phase.matches.forEach(m => {
      if(!byDate[m.date]) byDate[m.date] = [];
      byDate[m.date].push(m);
    });

    html += `<div class="knockout-section">
      <h3 class="knockout-title">${phase.label}</h3>`;

    Object.keys(byDate).sort().forEach(date => {
      const dateMatches = byDate[date];
      const allSaved = dateMatches.every(m => results.knockoutMatches?.[m.id]);

      html += `
      <div class="group-card" style="margin-bottom:1rem">
        <div class="group-header" style="justify-content:space-between">
          <h3 style="color:var(--gold);font-size:0.95rem">📅 ${fmtDate(date)} ${allSaved?'<span style="color:var(--green-light)">✔</span>':''}</h3>
          <div style="display:flex;gap:0.5rem">
            <button class="btn btn-sm btn-primary" onclick="saveDateKoResults('${date}','${phase.key}')">💾 Guardar</button>
            <button class="btn btn-sm btn-outline" onclick="editDateKoResults('${date}','${phase.key}')">✏️ Corregir</button>
          </div>
        </div>
      `;

      html += dateMatches.map(match => {
        const r = results.knockoutMatches?.[match.id] || {};
        const locked = results.knockoutMatches?.[match.id] !== undefined;

        // Equipos reales del slot
        const hId = r.homeTeam || realSlotAdmin(match.hs, match);
        const aId = r.awayTeam || realSlotAdmin(match.as, match);

        const hTeam = hId ? getTeam(hId) : null;
        const aTeam = aId ? getTeam(aId) : null;

        <div class="admin-match-row" style="${locked?'opacity:0.88':''}">
          <span class="admin-date">#${match.mn}</span>

          <div class="admin-match-teams" style="flex-direction:column;align-items:flex-start;gap:0.3rem">
            <div style="display:flex;align-items:center;gap:0.75rem;width:100%">
              <div class="team-display" style="flex:1;justify-content:flex-end">${hFlag}<span class="tname">${hName}</span></div>
              <div class="admin-score-inputs">
                <input type="number" min="0" max="30" class="score-input" id="admin_${match.id}_home"
                  value="${r.home!==undefined?r.home:''}" placeholder="0"${dis}
                  style="${lockStyle}"
                  oninput="adminKoScoreInput('${match.id}','${hId}','${aId}')">
                <span class="score-sep">—</span>
                <input type="number" min="0" max="30" class="score-input" id="admin_${match.id}_away"
                  value="${r.away!==undefined?r.away:''}" placeholder="0"${dis}
                  style="${lockStyle}"
                  oninput="adminKoScoreInput('${match.id}','${hId}','${aId}')">
              </div>
              <div class="team-display" style="flex:1">${aFlag}<span class="tname">${aName}</span></div>
            </div>
            ${penSel}
