          ${locked?`<span style="font-size:0.7rem;color:var(--green-light)">✓ ${r.home}—${r.away}${r.penaltyWinner?` (${getTeam(r.penaltyWinner)?.name[currentLang]||r.penaltyWinner})`:''}</span>`:''}
        </div>`;
      }).join('');

      html += `</div>`;
    });

    html += `</div>`;
  });

  return html;
}


// Detecta empate en tiempo real al escribir marcador en admin KO
function adminKoScoreInput(matchId, hId, aId){
  const hVal = document.getElementById(`admin_${matchId}_home`)?.value;
  const aVal = document.getElementById(`admin_${matchId}_away`)?.value;
  const penRow = document.getElementById(`pen_row_${matchId}`);
  if(!penRow) return;
  const h = parseInt(hVal);
  const a = parseInt(aVal);
  const isDraw = hVal !== '' && aVal !== '' && !isNaN(h) && !isNaN(a) && h === a;
  penRow.style.display = isDraw ? 'flex' : 'none';
  // Si ya no es empate, limpiar la selección de penales
  if(!isDraw){
    document.querySelectorAll(`input[name="pen_${matchId}"]`).forEach(r => r.checked = false);
  }
}

async function saveDateKoResults(date, phaseKey){
    const results = getResults();
    if(!results.knockoutMatches) results.knockoutMatches = {};

    const ko = KNOCKOUT_MATCHES;
    const phase = ko[phaseKey];
    if(!phase) return;

    // thirdPlace and final are single match objects, not arrays
    const phaseArr = Array.isArray(phase) ? phase : [phase];
    const matches = phaseArr.filter(m => m.date === date);

    // Datos reales para slots
    const realGS = buildRealGroupStandings();
    const thirdsReal = getBestThirdPlaces(results, null, false);
    const realThirdsSlots = assignThirdsToSlots(thirdsReal.all);

    const allMatches = [
        ...ko.roundOf32,
        ...ko.quarterFinals,
        ...ko.semiFinals,
        ...(ko.semiFinals2 || []),
        ko.thirdPlace,
        ko.final
    ];

    const winnerMap = buildWinnerMap(results);

    function realSlotAdmin(slot, match){
        if(!slot) return '';

        const mW = slot.match(/^W(\d+)$/);
        if(mW){
            return winnerMap[parseInt(mW[1])] || '';
        }

        const mL = slot.match(/^L(\d+)$/);
        if(mL){
            const prev = allMatches.find(m => m.mn === parseInt(mL[1]));
            const pr = results.knockoutMatches?.[prev.id];
            if(!pr || pr.home === undefined) return '';
            if(pr.home > pr.away) return pr.awayTeam||'';
            if(pr.away > pr.home) return pr.homeTeam||'';
            const pw = pr.penaltyWinner||'';
            return pw === pr.homeTeam ? pr.awayTeam||'' : pr.homeTeam||'';
        }

        return resolveRealSlotTeam(slot, match.id, realGS, realThirdsSlots);
    }

    const payload = [];

    let validationError = false;

    matches.forEach(match => {
        if(validationError) return;
        const hRaw = document.getElementById(`admin_${match.id}_home`)?.value;
        const aRaw = document.getElementById(`admin_${match.id}_away`)?.value;

        // Skip matches already saved (locked) — inputs are disabled, values may be empty strings
        const alreadySaved = results.knockoutMatches?.[match.id] !== undefined;
        if(alreadySaved) return;

        if(hRaw === '' || hRaw === undefined || aRaw === '' || aRaw === undefined || isNaN(parseInt(hRaw)) || isNaN(parseInt(aRaw))){
            showToast(`⚠️ Partido #${match.mn} — ingresa el marcador antes de guardar`, 'error');
            validationError = true;
            return;
        }

        const home = parseInt(hRaw);
        const away = parseInt(aRaw);

        const hId = realSlotAdmin(match.hs, match);
        const aId = realSlotAdmin(match.as, match);

        if(!hId || !aId){
            console.warn(`⚠️ Partido #${match.mn}: no se resolvieron equipos (hs:${match.hs}→${hId}, as:${match.as}→${aId}). Guardando sin equipos.`);
        }

        let penWinner = null;
        if(home === away){
            const radios = document.getElementsByName(`pen_${match.id}`);
            radios.forEach(r => { if(r.checked) penWinner = r.value; });
            if(!penWinner){
                showToast(`⚽ Partido #${match.mn} — hay empate, debes seleccionar quién avanza por penales`, 'error');
                validationError = true;
                return;
            }
        }

        payload.push({
            matchId: match.id,
            matchType: 'knockout',
            home: home,
            away: away,
            homeTeam: hId,
            awayTeam: aId,
            penaltyWinner: penWinner
        });
    });

    if(validationError) return;

    if(payload.length === 0){
        showToast('⚠️ No hay resultados para guardar', 'info');
        return;
    }

    try {
        await apiAdminPost('/api/results', { matches: payload });
        payload.forEach(m => {
            results.knockoutMatches[m.matchId] = {
                home: m.home,
                away: m.away,
                homeTeam: m.homeTeam,
                awayTeam: m.awayTeam,
                penaltyWinner: m.penaltyWinner
            };
        });
        appData.globalResults = results;
        showToast(`✅ ${payload.length} resultado(s) guardados — ${fmtDate(date)}`, 'success');
        renderAdmin();
    } catch(e) {
        console.error('saveDateKoResults error:', e);
        showToast(e.message || 'Error al guardar resultados', 'error');
    }
}

function editDateKoResults(date, phaseKey){
  const results = getResults();
  const ko = KNOCKOUT_MATCHES;
  const phase = ko[phaseKey];
  if(!phase) return;

  const phaseArr = Array.isArray(phase) ? phase : [phase];
  const matches = phaseArr.filter(m => m.date === date);

  matches.forEach(match => {
    if(results.knockoutMatches?.[match.id]){
      delete results.knockoutMatches[match.id];
    }
  });

  const allMatches = [
    ...ko.roundOf32,
    ...ko.quarterFinals,
    ...ko.semiFinals,
    ...(ko.semiFinals2 || []),
    ko.thirdPlace,
    ko.final
  ];

  allMatches.forEach(m => {
    const r = results.knockoutMatches?.[m.id];
    if(!r) return;

    const dependsOn = (slot) => {
      if(!slot) return false;
      const w = slot.match(/^W(\d+)$/);
      const l = slot.match(/^L(\d+)$/);
      if(w) return matches.some(x => x.mn === parseInt(w[1]));
      if(l) return matches.some(x => x.mn === parseInt(l[1]));
      return false;
    };

    if(dependsOn(m.hs) || dependsOn(m.as)){
      delete results.knockoutMatches[m.id];
    }
  });

  appData.globalResults = results;
  renderAdmin();
}

/**
 * Computes the 8 best third-place teams from the 12 groups using
 * official FIFA 2026 criteria:
 *   1. Points  2. Goal Difference  3. Goals For  4. Fair Play  5. Drawing of lots
 *
 * fairPlay per team is stored in group standings as .fp (negative number).
 * If not available, treated as 0.
 */
function getBestThirdPlaces(results, predData, forcePred=false){
  const thirds = [];
  GROUPS.forEach(group => {
    // forcePred=true → always use predictions (for the predictions tab)
    // Otherwise: use real results if admin has entered them, else predictions
    const hasRealResults = !forcePred && results && Object.keys(results.groupMatches||{}).some(k=>{
      const m = GROUP_MATCHES.find(x=>x.id===k); return m && m.group===group.id;
    });
    const standings = hasRealResults
      ? calcGroupStandingsFromResults(group.id, results)
      : calcGroupStandingsFromPred(group.id, predData||{groupMatches:{}});
    if(standings.length>=3 && standings[2].pj>0){
      thirds.push({
        team:  standings[2].id,
        group: group.id,
        pts:   standings[2].pts,
        gd:    standings[2].gd,
        gf:    standings[2].gf,
        ga:    standings[2].ga,
        fp:    standings[2].fp||0,   // fair play score (negative = cards)
      });
    }
  });

  // Sort by FIFA criteria
  thirds.sort((a,b)=>{
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(b.gd!==a.gd)  return b.gd-a.gd;
    if(b.gf!==a.gf)  return b.gf-a.gf;
    // Fair play: less negative = better
    if(b.fp!==a.fp)  return b.fp-a.fp;
    return 0; // drawing of lots — keep stable sort
  });

  const qualified = thirds.slice(0,8);
  return {all: thirds, qualified, qualifiedGroups: qualified.map(t=>t.group)};
}

/**

function renderBestThirdsPanel(thirds){

  const teamSlot = {};
  Object.entries(slotAssign).forEach(([slot,team])=>{ teamSlot[team]=slot; });

  // Slot label helper (show which 1st they face)
  const SLOT_LABEL = {
    R32_2:'vs 1E (P74)', R32_5:'vs 1I (P77)', R32_7:'vs 1A (P79)', R32_8:'vs 1L (P80)',
    R32_9:'vs 1D (P81)', R32_10:'vs 1G (P82)', R32_13:'vs 1B (P85)', R32_15:'vs 1K (P87)',
  };

  const rows = thirds.all.map((t3,i)=>{
    const qualified = i < 8;
    const team = getTeam(t3.team);
    const slot = teamSlot[t3.team];
    const slotLabel = slot ? SLOT_LABEL[slot] || slot : '';
    return `<tr style="${qualified?'background:rgba(59,130,246,0.1)':''}border-top:1px solid rgba(255,255,255,0.04)">
      <td style="padding:0.3rem 0.4rem;text-align:center;font-weight:700;color:${qualified?'#60a5fa':'var(--gray-400)'}">${i+1}</td>
      <td style="padding:0.3rem 0.4rem">

          ${qualified?`<span style="font-size:0.62rem;background:rgba(59,130,246,0.25);color:#60a5fa;border-radius:4px;padding:0 4px">✓ 3${t3.group}</span>`:''}
        </div>
        ${slotLabel?`<div style="font-size:0.62rem;color:var(--gray-400);margin-top:2px;margin-left:18px">${slotLabel}</div>`:''}
      </td>
      <td style="padding:0.3rem 0.4rem;text-align:center;color:var(--gray-400)">${t3.group}</td>
      <td style="padding:0.3rem 0.4rem;text-align:center;font-weight:700;color:${qualified?'#60a5fa':'var(--white)'}">${t3.pts}</td>
      <td style="padding:0.3rem 0.4rem;text-align:center;color:var(--gray-400)">${t3.gd>0?'+':''}${t3.gd}</td>
      <td style="padding:0.3rem 0.4rem;text-align:center;color:var(--gray-400)">${t3.gf}</td>
      <td style="padding:0.3rem 0.4rem;text-align:center;color:var(--gray-400)">${t3.ga}</td>
    </tr>`;
  }).join('');

  // ⭐ NEW: Build bracket using your REAL system (no THIRD_SLOT_CANDIDATES)
  const bracketRows = KNOCKOUT_MATCHES.roundOf32.map(matchDef=>{
    const slotId = matchDef.id;
    const awayTeamId = slotAssign[slotId];
    if(!awayTeamId) return '';

    const homeSlot = matchDef.hs; // e.g. "1E"
    const homeGrp  = homeSlot.slice(1);
    const homePos  = parseInt(homeSlot.slice(0,1)) - 1;

    const homeStandings = thirds._groupStandings ? thirds._groupStandings[homeGrp] : null;
    const homeTeamId = homeStandings ? homeStandings[homePos]?.id : null;

    const homeTeam = homeTeamId ? getTeam(homeTeamId) : null;
    const awayTeam = getTeam(awayTeamId);

    return `<div style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0.5rem;border-top:1px solid rgba(255,255,255,0.05);font-size:0.78rem">

      <span style="color:var(--gold)">${homeSlot}</span>
      ${homeTeam?flagImg(homeTeamId,'flag-img-sm'):''}
      <span style="color:var(--white)">${homeTeam?.name[currentLang]||homeSlot}</span>
      <span style="color:var(--gray-400)">vs</span>
      ${flagImg(awayTeamId,'flag-img-sm')}

  }).filter(Boolean).join('');

function scaleBracket(wrapperId, scaleId){
  const wrapper=document.getElementById(wrapperId);
  const inner=document.getElementById(scaleId);
  if(!wrapper||!inner) return;
  const available=wrapper.offsetWidth;
  const natural=1098; // 9 cols * 120px + 8 gaps * 6px
  const scale=Math.min(1, available/natural);
  inner.style.transform=`scale(${scale})`;
  inner.style.width=natural+'px';
  const innerH=inner.scrollHeight;
  wrapper.style.height=(innerH*scale)+'px';
}

  scaleBracket('bk-wrapper-pred','bk-scale-pred');
